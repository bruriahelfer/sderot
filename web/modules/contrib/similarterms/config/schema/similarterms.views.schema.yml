views.argument.similar_terms_arg:
  type: views.argument.numeric
  mapping:
    vocabularies:
      type: sequence
      label: 'Limit similarity to terms within these vocabularies'
      sequence:
        type: string
        label: 'Vocabulary'
    include_args:
      type: boolean
      label: 'Include argument node(s) in results'
    min_match_percentage:
      type: integer
      label: 'Minimum similarity match percentage'

views.field.similar_terms_field:
  type: views_field
  label: 'Similarity'
  mapping:
    count_type:
      type: integer
      label: 'Display type'
    percent_suffix:
      type: boolean
      label: 'Append % when showing percentage'
    weight_suffix:
      type: string
      label: 'Suffix for weight display'

views.sort.similar_terms_sort:
  type: views_sort
  label: 'Similar terms sort'
  mapping:
    sort_method:
      type: string
      label: 'Sort method'
